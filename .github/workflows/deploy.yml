name: Test and deploy API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install C++ to WebAssembly tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          command -v wasm-ld || sudo ln -s "$(ls /usr/bin/wasm-ld-* | sort -V | tail -n 1)" /usr/bin/wasm-ld

      - name: Install packages
        run: npm ci

      - name: C++ test (with sanitizers)
        run: npm run test:cpp

      - name: Build C++ to WebAssembly
        run: npm run build:wasm

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install C++ to WebAssembly tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          command -v wasm-ld || sudo ln -s "$(ls /usr/bin/wasm-ld-* | sort -V | tail -n 1)" /usr/bin/wasm-ld

      - name: Install packages
        run: npm ci

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.API_URL }}/state"